<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Sales Agent — Demo</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f6f7f9; color: #1a1a1a; }
    .wrap { max-width: 640px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 24px; }
    p { color: #555; }
    .sa-box { border: 1px solid #ddd; border-radius: 12px; background: #fff; overflow: hidden; }
    .sa-log { height: 320px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .sa-msg { padding: 8px 12px; border-radius: 10px; max-width: 80%; font-size: 14px; }
    .sa-bot { background: #eef2ff; align-self: flex-start; }
    .sa-user { background: #1f6feb; color: #fff; align-self: flex-end; }
    .sa-thinking { opacity: 0.6; }
    .sa-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #eee; }
    .sa-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    .sa-send { padding: 10px 16px; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AI Sales Agent — Website Widget Demo</h1>
    <p>Type below to chat via <code>POST /api/chat</code>.</p>
    <div id="sales-chat"></div>
  </div>
  <script src="/widget.js"></script>
</body>
</html>
